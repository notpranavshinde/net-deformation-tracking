[project]
name = "net-deformation-tracking"
version = "0.1.0"
description = "Stereo aquaculture net deformation tracking pipeline"
requires-python = ">=3.11"
# Placeholder: confirm the intended license with the paper authors before release.
license = { text = "MIT" }
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.26",
    "rich>=13.0",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "hydra-core>=1.3",
    "iopath>=0.1.10",
    "huggingface_hub>=0.20",
]

# Install torch and torchvision separately for the target CUDA runtime.
# SAM2 is vendored and should be installed with: pip install -e sam2/sam2
